name: CI

# Runs the quality gate documented in README.md and
# docs/NATIVE_SDK_GUIDE_AND_IMPROVEMENT_PLAN.md on every change.
#
# macOS remains the primary development host. Linux has its own build,
# package, and user-install gate below. Windows ARM64 is audited through the
# pinned environment documented in docs/WINDOWS_DEVELOPMENT.md because a
# matching hosted ARM64 runner is not part of this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run proves nothing about the tip of a branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (macOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # Whitespace and conflict-marker checking compares against the merge
          # base, which is unreachable in a shallow clone.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.15'
          cache: npm

      - name: Restore pinned Zig toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}

      - name: Restore Zig package and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', 'build.zig') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-

      # A restored cache can recreate ~/.cache/zig without the scratch
      # subdirectories Zig expects, which surfaces when it fetches the SQLite
      # amalgamation as:
      #   error: failed to create temporary zip file: FileNotFound
      - name: Prepare Zig cache directories
        run: mkdir -p "$HOME/.cache/zig/tmp" "$HOME/.cache/zig/p"

      - name: Provision toolchain
        run: scripts/setup-dev-env.sh

      - name: Report toolchain
        run: |
          zig version
          node --version
          npx native --version || true

      # Gate 1 — the runtime entrypoint must match the editable fragments.
      # src/app.native and its four bounded import shards are generated and
      # committed; drift means someone hand-edited an output or forgot to
      # regenerate the complete set.
      - name: Generate and assert no drift
        run: |
          npm run generate
          if [ -n "$(git status --porcelain)" ]; then
            echo '::error::`npm run generate` produced changes. Commit every regenerated output.'
            git status --short
            git --no-pager diff
            exit 1
          fi
          echo 'No generation drift.'

      # Gate 2 — the tax catalog is authored in strict TypeScript and compiled
      # to Zig. Typecheck it and prove the committed Zig matches.
      - name: Check tax catalog
        run: |
          npm run test:app-identity
          npm run check:tax-catalog

      # Gate 3 — no whitespace damage or conflict markers in the change itself.
      - name: Check diff hygiene
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Comparing against $base"
          git diff --check "$base" HEAD

      # Gate 4 — model, calendar, storage, export, and component behaviour,
      # including the SQLite-linked test roots registered in build.zig.
      - name: Run headless tests
        run: npx native test --yes -Dplatform=null

      # Gate 5 — markup and manifest must match the model contract.
      - name: Strict check
        run: |
          npx native check . --strict
          eval "$(node scripts/app-identity.mjs prepare --format shell)"
          npx native doctor --manifest "$BUWIZ_MANIFEST" --strict

      # Gate 6 — the ReleaseFast application must compile. Zig's lazy analysis
      # lets test and build each miss code reachable only from the other, so
      # both gates are required.
      - name: Build
        run: npx native build . --yes

  linux-quality-gate:
    name: Quality gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.15'
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libgtk-4-dev

      - name: Install Just
        run: cargo install just --version 1.43.1 --locked

      - name: Provision toolchain
        run: scripts/setup-dev-env.sh

      - name: Prepare Zig cache directories
        run: mkdir -p "$HOME/.cache/zig/tmp" "$HOME/.cache/zig/p"

      - name: Report toolchain
        run: |
          just --version
          zig version
          node --version
          npx native --version || true

      - name: Verify Linux build
        run: just verify

      - name: Package Linux artifact
        run: just package

      - name: Install Linux artifact
        env:
          BUWIZ_INSTALL_DIR: ${{ runner.temp }}/buwiz-install
        run: just install

      - name: Assert Linux install layout
        env:
          BUWIZ_INSTALL_DIR: ${{ runner.temp }}/buwiz-install
        run: |
          eval "$(node scripts/app-identity.mjs prepare --format shell)"
          test -x "$BUWIZ_INSTALL_DIR/bin/$BUWIZ_APP_NAME"
          test -x "$BUWIZ_INSTALL_DIR/lib/$BUWIZ_APP_NAME/bin/$BUWIZ_APP_NAME"
          test -f "$BUWIZ_INSTALL_DIR/share/applications/$BUWIZ_APP_NAME.desktop"
          grep -Fq "Exec=\"$BUWIZ_INSTALL_DIR/bin/$BUWIZ_APP_NAME\"" \
            "$BUWIZ_INSTALL_DIR/share/applications/$BUWIZ_APP_NAME.desktop"

  setup-script:
    name: Setup script (${{ matrix.os }})
    # Proves scripts/setup-dev-env.sh provisions a clean host on both the
    # supported build host and the Linux images used by development
    # containers, before any contributor or agent depends on it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.15'

      - name: Provision from a cold cache
        run: scripts/setup-dev-env.sh

      - name: Assert the pinned compiler is on PATH
        run: |
          zig version
          test "$(zig version)" = '0.16.0'

      - name: Assert a repeat run is idempotent and offline-clean
        run: |
          scripts/setup-dev-env.sh --skip-npm | tee second-run.log
          grep -q 'already installed' second-run.log
          if grep -q 'downloading' second-run.log; then
            echo '::error::Re-running the setup script downloaded Zig again.'
            exit 1
          fi
