name: News sync

# Scheduled BIR issuance sync (docs/news/IMPORTANT_NEWS_SYNC_EXECUTION_PLAN_2026-08-11.md,
# tasks T4.1-T4.3). Reads the public BIR CMS API, mines deadline-extension
# circulars out of their PDFs, and publishes the compiled feed to the orphan
# `news-feed` branch (decision D1). The app reads:
#
#   https://raw.githubusercontent.com/${{ github.repository }}/news-feed/feed.json
#
# This workflow is deliberately NOT part of ci.yml: CI runs only the offline
# tests over the committed captures. A failed run here publishes nothing, so the
# previously published feed stays live and the app keeps serving last-good data.

on:
  schedule:
    # UTC 04:00/10:00/16:00/22:00 = 12:00/18:00/00:00/06:00 Asia/Manila.
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

# Overlapping runs would race on the publishing branch.
concurrency:
  group: news-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.15'
          cache: npm

      - name: Install poppler
        # pdftotext -layout is the pipeline's only non-npm dependency; sync.ts
        # exits 2 with an install hint when it is missing.
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Report toolchain
        run: |
          node --version
          pdftotext -v

      # The offline gate first: a parser regression must fail here, against the
      # committed captures, rather than by publishing a wrong feed.
      - name: Verify pipeline offline
        run: |
          npm run typecheck:news-sync
          npm run test:news-sync

      # The previous run's outputs live on the publishing branch, not in this
      # checkout: `main` only carries the snapshot committed with the last code
      # change. Restoring them is what makes a run idempotent. Without it every
      # run rediscovers each issuance published since that commit, re-downloads
      # its PDF, and republishes a feed that differs only in `generated_at_unix`
      # and `firstSeenAtUnix` — four commits a day whether or not BIR published
      # anything. A missing branch (the very first run) correctly leaves the
      # checked-in files in place.
      - name: Restore the published outputs
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin news-feed >/dev/null 2>&1; then
            echo 'news-feed does not exist yet; keeping the checked-in outputs.'
            exit 0
          fi
          git fetch --depth=1 origin news-feed
          restore() { # <path-on-news-feed> <path-in-checkout>
            if git cat-file -e "origin/news-feed:$1" 2>/dev/null; then
              git show "origin/news-feed:$1" > "$2"
              echo "restored $1"
            else
              echo "news-feed carries no $1; keeping the checked-in copy."
            fi
          }
          restore feed.json scripts/news-sync/feed/feed.json
          restore state/seen.json scripts/news-sync/state/seen.json
          # Review reports are regenerated per extracted circular; restoring
          # them keeps an unchanged run from rewriting identical files.
          rm -rf scripts/news-sync/review
          mkdir -p scripts/news-sync/review
          git archive origin/news-feed review \
            | tar -x --strip-components=1 -C scripts/news-sync/review \
            || echo 'news-feed carries no review/; starting empty.'

      - name: Run sync
        id: sync
        run: |
          set -o pipefail
          npm run news:sync -- all 2>&1 | tee "$RUNNER_TEMP/sync.log"
          new_count="$(sed -n 's/^news-sync: summary new=\([0-9][0-9]*\) .*/\1/p' \
            "$RUNNER_TEMP/sync.log" | tail -n 1)"
          echo "new_count=${new_count:-0}" >> "$GITHUB_OUTPUT"

      # Nothing is published unless the compiled feed is present and parseable.
      - name: Assert the compiled feed is publishable
        run: |
          set -euo pipefail
          test -f scripts/news-sync/feed/feed.json
          test -f scripts/news-sync/state/seen.json
          node -e 'const f=require("./scripts/news-sync/feed/feed.json");
            if (f.schema_version !== 1 || f.source_label !== "BIR") {
              throw new Error("feed.json is not a schema-1 BIR feed");
            }
            console.log(`feed.json: ${f.notices.length} notices, ${f.overrides.length} overrides`);'

      - name: Publish to the news-feed branch
        if: success()
        env:
          NEW_COUNT: ${{ steps.sync.outputs.new_count }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/news-feed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin news-feed >/dev/null 2>&1; then
            git fetch --depth=1 origin news-feed
            git worktree add "$publish_dir" -B news-feed origin/news-feed
          else
            # First publish: an orphan branch with no history from main.
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" checkout --orphan news-feed
            git -C "$publish_dir" rm -rqf . || true
          fi

          rm -rf "$publish_dir/state" "$publish_dir/review"
          mkdir -p "$publish_dir/state" "$publish_dir/review"
          cp scripts/news-sync/feed/feed.json "$publish_dir/feed.json"
          cp scripts/news-sync/state/seen.json "$publish_dir/state/seen.json"
          cp -R scripts/news-sync/review/. "$publish_dir/review/"

          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo 'news-feed is already current; no commit made.'
          else
            git -C "$publish_dir" commit \
              -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ) (${NEW_COUNT:-0} new)"
            git -C "$publish_dir" push origin news-feed
            echo "Published ${NEW_COUNT:-0} new issuance(s) to news-feed."
          fi
          git worktree remove --force "$publish_dir"

      # T4.3 — make selector/OCR drift diagnosable from the run page alone.
      - name: Report failure
        if: failure()
        run: |
          echo '::error::news-sync failed; the previously published feed stays live.'
          if [ -f "$RUNNER_TEMP/sync.log" ]; then
            echo '::group::Last 40 lines of the sync log'
            tail -n 40 "$RUNNER_TEMP/sync.log"
            echo '::endgroup::'
          fi
          if [ -d scripts/news-sync/review ]; then
            echo '::group::Review reports touched by this run'
            git status --porcelain scripts/news-sync/review scripts/news-sync/feed \
              scripts/news-sync/state || true
            echo '::endgroup::'
          fi
          echo '::error::Triage: HTTP 403 means the CMS header contract drifted' \
            '(fixtures/2026-08-11/CAPTURES.md); exit code 2 means poppler is missing;' \
            'an office-count or row mismatch is written into the review report.'
